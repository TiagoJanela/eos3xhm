Identifier: eos3xhm
Slug: hades-oral-druglikeness
Status: In progress
Title: HADES Oral Drug-Likeness
Description: Scores how closely a compound resembles an approved oral drug, with
  0.63 the authors recommended cutoff. HADES averages the probabilities of five 
  tree and boosting classifiers trained on 1, 177 approved oral drugs against 5,
  307 nondrugs from ChEMBL, ZINC and GDB, featurised with Mordred descriptors 
  and ADMET-AI predictions. Scores rise across clinical phases and fall for 
  orally toxic, small-ring and chemically implausible structures. It captures 
  resemblance to approved oral drugs rather than general drug-likeness, and some
  approved orals such as etravirine and pilocarpine score low.
